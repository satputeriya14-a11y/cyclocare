<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - CycloCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌸 CycloCare</h1>
        <p>Your Period Health & Wellness Companion</p>
    </header>

    <main>

        <section class="login-box">

            <h2>📝 Create Account</h2>

            <p>Create your CycloCare account to start tracking.</p>

           <form onsubmit="handleRegister(event)">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

                <button type="submit">Create Account</button>

            </form>

            <p class="register-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 CycloCare | Period Health & Wellness System</p>
    </footer>

    <script>
      function handleRegister(event) {
            event.preventDefault();
            
            let nameInput = document.getElementById("name") ? document.getElementById("name").value.trim() : "";
            let emailInput = document.getElementById("email") ? document.getElementById("email").value.trim() : "";
            
            sessionStorage.setItem("loggedIn", "true");
            
            if (nameInput) {
                localStorage.setItem("userName", nameInput);
            } else if (emailInput) {
                let namePart = emailInput.split('@')[0];
                localStorage.setItem("userName", namePart.charAt(0).toUpperCase() + namePart.slice(1));
            }
            
            if (emailInput) {
                localStorage.setItem("userEmail", emailInput);
                // Set active user key prefix for new account
                localStorage.setItem("currentUserKey", emailInput.toLowerCase());
            }

            window.location.href = "index.html";
        }
   
    </script>

</body>

</html>
