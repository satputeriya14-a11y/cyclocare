<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycloCare - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>
        <h1>🌸 CycloCare</h1>
        <p>Your Period Health & Wellness Companion</p>
       <nav>
            <a href="./index.html">Home</a>
            <a href="./index.html#tracker">Period Tracker</a>
            <a href="./index.html#symptoms">Symptoms</a>
            <a href="./index.html#reminders">Reminders</a>
            <a href="./health.html">Health Tips</a>
            <a href="./profile.html">Profile</a>
        </nav>
    </header>


    <!-- ================= PROFILE ================= -->
    <main>
        <section class="profile-section">
            <h2>👤 My Profile</h2>
            <div class="profile-card">
                <div class="profile-icon">
                    👩🏻
                </div>
                <h3 id="profileName">
                    CycloCare User
                </h3>
                <p>
                    <strong>Email:</strong>
                    <span id="profileEmail">
                        user@cyclocare.com
                    </span>
                </p>
                <p>
                    <strong>Account:</strong>
                    CycloCare User
                </p>

                <!-- ================= PERIOD HISTORY ================= -->
                <div style="margin-top: 20px; text-align: left;">
                    <h3>🩸 My Period History</h3>
                    <ul id="profilePeriodHistory" style="list-style-type: none; padding-left: 0;">
                        <li>No period history logged yet.</li>
                    </ul>
                </div>

                <button onclick="logoutUser()" style="margin-top: 20px;">
                    Logout
                </button>
            </div>
        </section>
    </main>


    <!-- ================= SCRIPT ================= -->
    <script>
        function loadProfile() {
            let name = localStorage.getItem("userName") || "CycloCare User";
            let email = localStorage.getItem("userEmail") || "user@cyclocare.com";

            let nameElem = document.getElementById("profileName");
            let emailElem = document.getElementById("profileEmail");
            
            if (nameElem) nameElem.innerText = name;
            if (emailElem) emailElem.innerText = email;

            // Load user-specific period history
            let userKey = localStorage.getItem("currentUserKey") || "default";
            let history = JSON.parse(localStorage.getItem(userKey + "_periodHistory")) || [];
            let historyList = document.getElementById("profilePeriodHistory");

            if (historyList) {
                if (history.length > 0) {
                    historyList.innerHTML = ""; // Clear default text
                    let currentMonthYear = "";

                    history.forEach(function(startDateStr) {
                        let parts = startDateStr.split("-");
                        let start = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                        
                        // Calculate 5-day period end date
                        let end = new Date(start);
                        end.setDate(end.getDate() + 4);

                        // Extract Month and Year (e.g., "September 2026")
                        let monthYear = start.toLocaleString("default", { month: "long", year: "numeric" });

                        // Format dates strictly to "8 Sep 2026"
                        let options = { day: "numeric", month: "short", year: "numeric" };
                        let formattedStart = start.toLocaleDateString("en-GB", options);
                        let formattedEnd = end.toLocaleDateString("en-GB", options);

                        // If the month changes, create a new heading
                        if (monthYear !== currentMonthYear) {
                            let monthHeading = document.createElement("h4");
                            monthHeading.innerText = monthYear;
                            monthHeading.style.marginTop = "15px";
                            monthHeading.style.marginBottom = "5px";
                            monthHeading.style.color = "#d63384"; // matches cyclocare vibe
                            historyList.appendChild(monthHeading);
                            currentMonthYear = monthYear;
                        }

                        // Create the bullet points for start and end
                        let ul = document.createElement("ul");
                        ul.style.listStyleType = "disc";
                        ul.style.paddingLeft = "20px";
                        ul.style.marginBottom = "10px";

                        let liStart = document.createElement("li");
                        liStart.innerText = "Period Start: " + formattedStart;
                        let liEnd = document.createElement("li");
                        liEnd.innerText = "Period End: " + formattedEnd;

                        ul.appendChild(liStart);
                        ul.appendChild(liEnd);
                        historyList.appendChild(ul);
                    });
                } else {
                    historyList.innerHTML = "<li>No period history logged yet.</li>";
                }
            }
        }
 

        function logoutUser() {
            // Clear session so index.html doesn't auto-login again
            sessionStorage.removeItem("loggedIn");
            // Redirect straight to login screen
            window.location.href = "login.html";
        }

        loadProfile();
    </script>

</body>

</html>
