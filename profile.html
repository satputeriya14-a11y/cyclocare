<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CycloCare - Profile</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <h1>🌸 CycloCare</h1>

        <p>Your Period Health & Wellness Companion</p>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#tracker">Period Tracker</a>

            <a href="index.html#symptoms">Symptoms</a>

            <a href="index.html#reminders">Reminders</a>

            <a href="health.html">Health Tips</a>

            <a href="profile.html">Profile</a>

        </nav>

    </header>


    <!-- ================= PROFILE ================= -->

    <main>

        <section class="profile-section">

            <h2>👤 My Profile</h2>

            <div class="profile-card">

                <div class="profile-icon">
                    👩🏻
                </div>

                <h3 id="profileName">
                    Loading...
                </h3>

                <p>
                    <strong>Email:</strong>
                    <span id="profileEmail">
                        Loading...
                    </span>
                </p>

                <p>
                    <strong>Account:</strong>
                    CycloCare User
                </p>

                <button onclick="logoutUser()">
                    Logout
                </button>

            </div>

        </section>

    </main>


    <!-- ================= SCRIPT ================= -->

    <script>

        function loadProfile() {

            fetch("get_profile.php")

                .then(function(response) {
                    return response.json();
                })

                .then(function(data) {

                    if (data.success) {

                        document.getElementById(
                            "profileName"
                        ).innerText =
                            data.name;

                        document.getElementById(
                            "profileEmail"
                        ).innerText =
                            data.email;

                    } else {

                        document.getElementById(
                            "profileName"
                        ).innerText =
                            "User not logged in.";

                        document.getElementById(
                            "profileEmail"
                        ).innerText =
                            "";

                    }

                })

                .catch(function(error) {

                    console.error(error);

                    document.getElementById(
                        "profileName"
                    ).innerText =
                        "Could not load profile.";

                });

        }


        function logoutUser() {

            window.location.href =
                "logout.php";

        }


        loadProfile();

    </script>

</body>

</html>
