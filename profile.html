<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycloCare - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>
        <h1>🌸 CycloCare</h1>
        <p>Your Period Health & Wellness Companion</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#tracker">Period Tracker</a>
            <a href="index.html#symptoms">Symptoms</a>
            <a href="index.html#reminders">Reminders</a>
            <a href="health.html">Health Tips</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>


    <!-- ================= PROFILE ================= -->
    <main>
        <section class="profile-section">
            <h2>👤 My Profile</h2>
            <div class="profile-card">
                <div class="profile-icon">
                    👩🏻
                </div>
                <h3 id="profileName">
                    CycloCare User
                </h3>
                <p>
                    <strong>Email:</strong>
                    <span id="profileEmail">
                        user@cyclocare.com
                    </span>
                </p>
                <p>
                    <strong>Account:</strong>
                    CycloCare User
                </p>

                <!-- ================= PERIOD HISTORY ================= -->
                <div style="margin-top: 20px; text-align: left;">
                    <h3>🩸 My Period History</h3>
                    <ul id="profilePeriodHistory" style="list-style-type: none; padding-left: 0;">
                        <li>No period history logged yet.</li>
                    </ul>
                </div>

                <button onclick="logoutUser()" style="margin-top: 20px;">
                    Logout
                </button>
            </div>
        </section>
    </main>


    <!-- ================= SCRIPT ================= -->
    <script>
        function loadProfile() {
            let name = localStorage.getItem("userName") || "CycloCare User";
            let email = localStorage.getItem("userEmail") || "user@cyclocare.com";

            document.getElementById("profileName").innerText = name;
            document.getElementById("profileEmail").innerText = email;

            // Load user-specific period history
            let userKey = localStorage.getItem("currentUserKey") || "default";
            let history = JSON.parse(localStorage.getItem(userKey + "_periodHistory")) || [];
            let historyList = document.getElementById("profilePeriodHistory");

            if (historyList) {
                if (history.length > 0) {
                    historyList.innerHTML = "";
                    history.forEach(function(startDateStr) {
                        let parts = startDateStr.split("-");
                        let start = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                        
                        // Calculate 5-day period end date
                        let end = new Date(start);
                        end.setDate(end.getDate() + 4);

                        let formattedStart = start.toLocaleDateString();
                        let formattedEnd = end.toLocaleDateString();

                        let li = document.createElement("li");
                        li.style.padding = "8px 0";
                        li.style.borderBottom = "1px solid #eee";
                        li.innerText = "Start: " + formattedStart + "  |  End: " + formattedEnd;
                        historyList.appendChild(li);
                    });
                } else {
                    historyList.innerHTML = "<li>No period history logged yet.</li>";
                }
            }
        }

        function logoutUser() {
            // Clear session so index.html doesn't auto-login again
            sessionStorage.removeItem("loggedIn");
            // Redirect straight to login screen
            window.location.href = "login.html";
        }

        loadProfile();
    </script>

</body>

</html>
