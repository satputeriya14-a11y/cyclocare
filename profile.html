<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycloCare - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>
        <h1>🌸 CycloCare</h1>
        <p>Your Period Health & Wellness Companion</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#tracker">Period Tracker</a>
            <a href="index.html#symptoms">Symptoms</a>
            <a href="index.html#reminders">Reminders</a>
            <a href="health.html">Health Tips</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>


    <!-- ================= PROFILE ================= -->
    <main>
        <section class="profile-section">
            <h2>👤 My Profile</h2>
            <div class="profile-card">
                <div class="profile-icon">
                    👩🏻
                </div>
                <h3 id="profileName">
                    CycloCare User
                </h3>
                <p>
                    <strong>Email:</strong>
                    <span id="profileEmail">
                        user@cyclocare.com
                    </span>
                </p>
                <p>
                    <strong>Account:</strong>
                    CycloCare User
                </p>
                <button onclick="logoutUser()">
                    Logout
                </button>
            </div>
        </section>
    </main>


    <!-- ================= SCRIPT ================= -->
    <script>
        function loadProfile() {
            // Read from localStorage if user set it up, otherwise display fallback demo values
            let name = localStorage.getItem("userName") || "CycloCare User";
            let email = localStorage.getItem("userEmail") || "user@cyclocare.com";

            document.getElementById("profileName").innerText = name;
            document.getElementById("profileEmail").innerText = email;
        }

        function logoutUser() {
            // Redirect cleanly back to the home page instead of downloading logout.php
            window.location.href = "index.html";
        }

        loadProfile();
    </script>

</body>

</html>
