<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CycloCare</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌸 CycloCare</h1>
        <p>Your Period Health & Wellness Companion</p>
    </header>

    <main>

        <section class="login-box">

            <h2>🔐 Login</h2>

            <p>Welcome back! Please login to continue.</p>

            <form onsubmit="handleLogin(event)">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 CycloCare | Period Health & Wellness System</p>
    </footer>

    <script>
      function handleLogin(event) {
            event.preventDefault(); // Stop form from submitting to login.php
            
            let emailInput = document.getElementById("email").value.trim();
            
            // Save login state and user info in browser storage
            sessionStorage.setItem("loggedIn", "true");
            if (emailInput) {
                localStorage.setItem("userEmail", emailInput);
                let namePart = emailInput.split('@')[0];
                localStorage.setItem("userName", namePart.charAt(0).toUpperCase() + namePart.slice(1));
            }

            // Redirect to main tracker page
            window.location.href = "index.html";
        }
    </script>

</body>

</html>
